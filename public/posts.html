<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帖子墙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f7f7f7; min-height: 100dvh; }
  .top-bar { background: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #eee; }
  .top-bar .back { text-decoration: none; color: #333; font-size: 15px; display: flex; align-items: center; gap: 4px; }
  .top-bar .title { font-size: 16px; font-weight: 600; }
  .top-bar .post-btn { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .posts { max-width: 560px; margin: 0 auto; padding: 12px; }
  .post { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
  .post .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .post .avatar { width: 32px; height: 32px; border-radius: 50%; background: #e8f4ff; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .post .author { font-size: 13px; font-weight: 600; color: #333; }
  .post .time { font-size: 11px; color: #aaa; }
  .post .text { font-size: 14px; line-height: 1.7; color: #333; word-break: break-word; }
  .post img { max-width: 100%; border-radius: 8px; margin-top: 10px; display: block; cursor: zoom-in; }
  .empty { text-align: center; color: #aaa; font-size: 14px; padding: 60px 0; }

  .post-del { float: right; border: none; background: #f5f5f5; color: #999; border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
  .post-del:hover { background: #fee; color: #e55; }

  /* 会员密码门 */
  .gate { position: fixed; inset: 0; background: #f7f7f7; display: none; align-items: center; justify-content: center; z-index: 200; }
  .gate-card { background: #fff; border-radius: 14px; padding: 32px 28px; width: 85%; max-width: 320px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .gate-card .icon { font-size: 40px; margin-bottom: 10px; }
  .gate-card h3 { font-size: 17px; margin-bottom: 6px; }
  .gate-card p { font-size: 13px; color: #999; margin-bottom: 18px; }
  .gate-card input { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 11px 14px; font-size: 15px; text-align: center; letter-spacing: 4px; margin-bottom: 14px; outline: none; }
  .gate-card input:focus { border-color: #2563eb; }
  .gate-card .enter { width: 100%; background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 11px; font-size: 15px; cursor: pointer; }
  .gate-card .err { color: #ef4444; font-size: 12px; margin-bottom: 10px; display: none; }
  .gate-card .hint { font-size: 11px; color: #bbb; margin-top: 14px; }

  /* 发帖弹窗 */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; z-index: 100; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 14px; width: 90%; max-width: 400px; padding: 20px; }
  .modal h3 { font-size: 16px; margin-bottom: 14px; }
  .modal input[type="password"], .modal textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; font-family: inherit; }
  .modal textarea { min-height: 90px; resize: vertical; }
  .modal .img-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .modal .img-btn { background: #f0f0f0; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; color: #555; }
  .modal .img-preview { max-width: 90px; max-height: 90px; border-radius: 8px; display: none; }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal .actions button { border: none; border-radius: 8px; padding: 9px 20px; font-size: 14px; cursor: pointer; }
  .modal .cancel { background: #f0f0f0; color: #555; }
  .modal .submit { background: #2563eb; color: #fff; }
  .modal .err { color: #ef4444; font-size: 12px; margin-bottom: 10px; display: none; }
</style>
</head>
<body>

  <!-- 会员密码门 -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <div class="icon">📢</div>
      <h3>帖子墙</h3>
      <p>请输入会员密码</p>
      <div class="err" id="gateErr">密码错误，请重试</div>
      <input type="password" id="gatePw" placeholder="密码" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="enter" id="gateEnter">进入</button>
      <div class="hint">帖子墙仅对会员开放</div>
    </div>
  </div>

  <div class="top-bar">
    <a class="back" href="/">‹ 返回</a>
    <span class="title">📢 帖子墙</span>
    <button class="post-btn" id="postBtn" style="display:none">发帖</button>
  </div>

  <div class="posts" id="postList">
    <div class="empty">加载中...</div>
  </div>

  <!-- 发帖弹窗 -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <h3>发帖</h3>
      <div class="err" id="errBox"></div>
      <input type="password" id="pwInput" placeholder="管理密码" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <textarea id="textInput" placeholder="写点什么..."></textarea>
      <div class="img-row">
        <button class="img-btn" id="imgBtn">📷 添加图片</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        <img class="img-preview" id="imgPreview" alt="">
      </div>
      <div class="actions">
        <button class="cancel" id="cancelBtn">取消</button>
        <button class="submit" id="submitBtn">发布</button>
      </div>
    </div>
  </div>

<script>
  const list = document.getElementById("postList");
  const overlay = document.getElementById("overlay");
  const errBox = document.getElementById("errBox");
  const pwInput = document.getElementById("pwInput");
  const textInput = document.getElementById("textInput");
  const fileInput = document.getElementById("fileInput");
  const imgPreview = document.getElementById("imgPreview");
  const gate = document.getElementById("gate");
  const gatePw = document.getElementById("gatePw");
  const gateErr = document.getElementById("gateErr");
  const postBtn = document.getElementById("postBtn");
  let uploadedUrl = "";

  const emojiMap = { admin: "👤", tg: "✈️" };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function fmtTime(iso) {
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "刚刚";
      if (diff < 3600) return Math.floor(diff / 60) + "分钟前";
      if (diff < 86400) return Math.floor(diff / 3600) + "小时前";
      const m = (d.getMonth() + 1) + "月" + d.getDate() + "日";
      if (d.getFullYear() === now.getFullYear()) return m;
      return d.getFullYear() + "年" + m;
    } catch (e) { return ""; }
  }

  async function renderPosts(posts) {
    if (!posts || !posts.length) {
      list.innerHTML = '<div class="empty">还没有帖子，来发第一帖吧</div>';
      return;
    }
    // 是否管理员（显示删除按钮）
    let isAdmin = false;
    try {
      const r = await fetch("/api/admin-check");
      const d = await r.json();
      isAdmin = !!d.admin;
    } catch (e) {}

    list.innerHTML = posts.map(p => `
      <div class="post">
        <div class="meta">
          <span class="avatar">${emojiMap[p.author] || "👤"}</span>
          <div>
            <div class="author">${esc(p.author === "admin" ? "焦羽" : p.author)}</div>
            <div class="time">${fmtTime(p.time)}</div>
          </div>
          ${isAdmin ? `<button class="post-del" data-id="${esc(p.id)}">删除</button>` : ""}
        </div>
        ${p.text ? `<div class="text">${esc(p.text)}</div>` : ""}
        ${p.image ? `<img src="${esc(p.image)}" onclick="window.open(this.src)" alt="">` : ""}
      </div>
    `).join("");
    // 删除按钮事件
    list.querySelectorAll(".post-del").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id;
        if (!confirm("确定删除这条帖子吗？")) return;
        try {
          const resp = await fetch("/api/posts/" + id, { method: "DELETE" });
          if (resp.ok) {
            loadPosts();
          } else {
            alert("删除失败：无权限或帖子不存在");
          }
        } catch (e) {
          alert("删除失败，请重试");
        }
      });
    });
  }

  async function loadPosts() {
    try {
      const resp = await fetch("/api/posts");
      if (resp.status === 401) {
        // 未登录 → 显示会员密码门
        gate.style.display = "flex";
        gatePw.focus();
        return;
      }
      // 已登录：确保密码门隐藏
      gate.style.display = "none";
      const posts = await resp.json();
      renderPosts(posts);
    } catch (e) {
      list.innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
    }
  }

  // 会员密码门登录
  function gateLogin() {
    const pw = gatePw.value.trim();
    if (!pw) return;
    fetch("/api/member-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pw })
    }).then(async resp => {
      const data = await resp.json().catch(() => ({}));
      if (resp.ok && data.ok) {
        gate.style.display = "none";
        loadPosts();
      } else {
        gateErr.style.display = "block";
        gatePw.value = "";
        gatePw.focus();
      }
    }).catch(() => {
      gateErr.style.display = "block";
    });
  }
  document.getElementById("gateEnter").onclick = gateLogin;
  gatePw.addEventListener("keydown", e => { if (e.key === "Enter") gateLogin(); });

  // 判断身份：管理员显示发帖按钮
  async function checkAdmin() {
    try {
      const resp = await fetch("/api/admin-check");
      const data = await resp.json();
      if (data.admin) {
        postBtn.style.display = "inline-block";
      }
    } catch (e) {}
  }

  // 发帖弹窗
  document.getElementById("postBtn").onclick = () => {
    errBox.style.display = "none";
    pwInput.value = ""; textInput.value = ""; uploadedUrl = "";
    imgPreview.style.display = "none";
    overlay.classList.add("show");
    pwInput.focus();
  };
  document.getElementById("cancelBtn").onclick = () => overlay.classList.remove("show");
  overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove("show"); };

  // 图片选择
  document.getElementById("imgBtn").onclick = () => fileInput.click();
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;
    const form = new FormData();
    form.append("image", file);
    try {
      const resp = await fetch("/upload-post", { method: "POST", body: form });
      const data = await resp.json();
      if (data.url) {
        uploadedUrl = data.url;
        imgPreview.src = data.url;
        imgPreview.style.display = "block";
      } else {
        errBox.textContent = data.error || "图片上传失败";
        errBox.style.display = "block";
      }
    } catch (e) {
      errBox.textContent = "图片上传失败";
      errBox.style.display = "block";
    }
    fileInput.value = "";
  };

  // 发布
  document.getElementById("submitBtn").onclick = async () => {
    const pw = pwInput.value.trim();
    const text = textInput.value.trim();
    if (!pw) { errBox.textContent = "请输入管理密码"; errBox.style.display = "block"; return; }
    if (!text && !uploadedUrl) { errBox.textContent = "内容不能为空"; errBox.style.display = "block"; return; }
    try {
      const resp = await fetch("/api/posts?pw=" + encodeURIComponent(pw), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, image: uploadedUrl })
      });
      const data = await resp.json();
      if (!resp.ok || !data.ok) {
        errBox.textContent = data.error || "发布失败";
        errBox.style.display = "block";
        return;
      }
      overlay.classList.remove("show");
      loadPosts();
    } catch (e) {
      errBox.textContent = "发布失败";
      errBox.style.display = "block";
    }
  };

  loadPosts();
  checkAdmin();
  // 每 30s 自动刷新（有新帖自动出现）
  setInterval(loadPosts, 30000);
</script>
</body>
</html>
